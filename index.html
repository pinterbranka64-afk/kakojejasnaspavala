<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kako je Jasna spavala?</title>

    <meta property="og:title" content="Kako je Jasna spavala?">
    <meta property="og:description" content="Ova stranica je nastala kao iskrena briga za vizionarku pred izbore za treći krug oko sunca. Zaokružite 3.">
    <meta property="og:image" content="https://pinterbranka64-afk.github.io/kakojejasnaspavala/slika.jpg">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Kako je Jasna spavala?">
    <meta name="twitter:description" content="Ova stranica je nastala kao iskrena briga za vizionarku pred izbore za treći krug oko sunca. Zaokružite 3.">
    <meta name="twitter:image" content="https://pinterbranka64-afk.github.io/kakojejasnaspavala/slika.jpg">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: #1a232a;
            display: flex; justify-content: center; align-items: center;
        }
        #rainCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .card {
            position: relative; z-index: 2;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px; padding: 40px 30px;
            max-width: 90%; width: 500px; text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .card-img {
            width: 120px; height: 120px; border-radius: 50%; object-fit: cover;
            margin-bottom: 20px; border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .card h1 {
            color: #ffffff; font-size: 2.1rem; font-weight: bold; line-height: 1.4;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        @media (max-width: 600px) {
            .card h1 { font-size: 1.5rem; }
            .card-img { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>
    <canvas id="rainCanvas"></canvas>
    <div class="card">
        <img src="slika.jpg" alt="Jasna" class="card-img">
        <h1 id="quote">Učitavanje...</h1>
    </div>

    <script>
        const quotes = [
            "Zaspala bi ona, ali ko će onda voditi HRabriše.",
            "Nije spavala, sanjala je da je debeli opet ukro memorandum.",
            "Nije spavala, čupala je SVOJU kosicu u snu.",
            "Nije oka sklopila zbog one dve istog imena.",
            "Nije spavala, sanjala je baštu. Sve cveće uvelo.",
            "Spavala i sanjala da je u EU parlamentu. Kad se probudila shvatila da se snovi ne ispunjavaju kad ih sanjaš.",
            "Oči sklopila nije, broji procente umesto ovaca.",
            "Zaspala na 12 minuta, ali ju je probudio šum glasačkog listića.",
            "Valerijana više ne deluje. Počela da čita sopstvena obećanja da se uspava.",
            "Sanjala je fokus grupu. Svi su vikali tri, tri, tri.",
            "Jastuk je tvrd, ali je konkurencija još tvrđa.",
            "Noćna mora: sanjala da je zaokružila broj 3.",
            "Izborna tišina, ali u njenoj glavi sviraju tamburaši iz kampanje: tri poljupca hoću ja, neću jedan, neću dva.",
            "Dan izbora. Kakav san? U 03:30 čeka otvaranje biračkog mesta.",
            "Zaspala bi ona, ali ko će onda pratiti prljavu kampanju u trećoj smeni?",
            "Sanja samo cenzus i nevažeće listiće.",
            "Podočnjaci su postali zvanični deo izbornog štaba.",
            "Pokušala je da spava, ali joj se javio marketing tim sa „genijalnom idejom“.",
            "Oči su joj crvene, baš kao i opozicija u njenim snovima.",
            "Popila je toplu vodu sa limunom, ali joj gorčina izlaza na birališta ne da mira.",
            "Brojala je ovce do 333, ali se uplašila jer su sve sa Cvijinog spiska sigurnih glasova.",
            "Zaspala je u fotelji, ali se uplašila da će iz nje da je izbace dok spava.",
            "Brojala u snu eure cele noći. Slavine presušile.",
            "Sanja kako drži govor, a mikrofon ne radi. Probudila se u hladnom znoju.",
            "Noćas ne spava jer piše pobednički i gubitnički govor za svaki slučaj.",
            "Nije spavala. Pijuk opet izgubio mobilni sa brojevima birača.",
            "Nema spavanja. Terenski rad u 3:00 ujutro. Radak nije došao sa lecima.",
            "Ne može da spava. Plaši se hoće li je Kaurić izdati.",
            "Zaspala na kratko, ali se probudila kad je shvatila da je zadnji bolji po svim anketama.",
            "Nije spavala, gleda podkast 33. put."
        ];
        document.getElementById('quote').innerText = quotes[Math.floor(Math.random() * quotes.length)];

        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        const drops = [];
        const count = 100;
        for (let i = 0; i < count; i++) {
            drops.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                length: Math.random() * 20 + 10,
                speed: Math.random() * 10 + 5,
                opacity: Math.random() * 0.3 + 0.1
            });
        }
        function drawRain() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < count; i++) {
                let d = drops[i];
                ctx.beginPath();
                ctx.moveTo(d.x, d.y);
                ctx.lineTo(d.x, d.y + d.length);
                ctx.strokeStyle = `rgba(255, 255, 255, ${d.opacity})`;
                ctx.lineWidth = 1;
                ctx.lineCap = 'round';
                ctx.stroke();
                d.y += d.speed;
                if (d.y > canvas.height) { d.y = -d.length; d.x = Math.random() * canvas.width; }
            }
            requestAnimationFrame(drawRain);
        }
        drawRain();
    </script>
</body>
</html>
